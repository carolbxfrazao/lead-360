<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Lead 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Oswald:wght@500;600&display=swap">
<style>
/* Tokens do Design System Lead Group. Uma coluna, uma seção por tela, pensada para o celular. */
:root{
  color-scheme:dark;
  --surface:#000;--raised:#1a1a1a;--ink:#fff;--muted:#9a9ca0;--line:#3a3a3c;
  --brand:#f05625;--on-brand:#000;--brand-text:#f05625;--focus:#fff;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;--text:"Lato","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface);color:var(--ink);font:400 16px/1.5 var(--text)}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{height:20px;width:auto;display:block;fill:var(--brand)}
.passo{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.barra{max-width:560px;margin:8px auto 0;height:4px;background:var(--raised)}
.barra i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}
main{max-width:560px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
h1{font:600 34px/1.15 var(--display);text-transform:uppercase;margin:0 0 12px;text-wrap:balance}
h2{font:600 22px/1.2 var(--display);text-transform:uppercase;margin:0 0 4px}
p{margin:0 0 12px}
.apoio{color:var(--muted);font-size:15px}
.etiqueta{display:inline-block;background:var(--brand);color:var(--on-brand);font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;margin-bottom:14px}
.promessa{background:var(--raised);padding:16px;margin:18px 0;display:grid;gap:10px}
.promessa b{display:block}
.bloco{background:var(--raised);border-radius:8px;padding:14px 12px;margin:0 0 16px}
.bloco>h2{margin-bottom:10px}
.q{border:0;margin:0 0 20px;padding:0;min-width:0}
.bloco .q:last-child{margin-bottom:4px}
.q legend,.q>label{display:block;font-weight:700;padding:0;margin-bottom:8px}
.q small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.q.falta legend,.q.falta>label{color:var(--brand-text)}
.q.falta legend::after,.q.falta>label::after{content:" (falta responder)";font-weight:400;font-size:14px}
.escala{display:grid;gap:4px}
.e6{grid-template-columns:repeat(6,1fr)}
.e7{grid-template-columns:repeat(7,1fr)}
.escala label{position:relative;display:block;cursor:pointer}
.escala input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.escala span{display:flex;align-items:center;justify-content:center;height:44px;border:1px solid var(--muted);border-radius:4px;font-weight:700;background:var(--surface);font-variant-numeric:tabular-nums}
.escala input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.escala input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.pontas{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;margin-top:4px}
textarea,select,input[type=text]{width:100%;font:400 16px/1.4 var(--text);color:var(--ink);background:var(--surface);border:1px solid var(--muted);border-radius:4px;padding:10px}
textarea{min-height:92px;resize:vertical}
textarea:focus-visible,select:focus-visible,input[type=text]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.grupo{margin:0 0 14px}
.grupo h3{margin:0 0 6px;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fichas{display:flex;flex-wrap:wrap;gap:6px}
.ficha{font:700 15px/1 var(--text);padding:11px 12px;min-height:40px;border:1px solid var(--muted);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer}
.ficha[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.ficha:focus-visible,.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.contagem{font-weight:700;margin:4px 0 16px}
.acoes{display:flex;gap:8px;margin-top:24px}
.btn{font:900 16px/1 var(--text);min-height:50px;padding:0 18px;border-radius:4px;cursor:pointer;border:1px solid var(--muted);background:transparent;color:var(--ink)}
.btn.principal{flex:1;background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn[disabled]{opacity:.6;cursor:default}
.aviso{color:var(--brand-text);font-weight:700;margin:12px 0 0}
@media (prefers-reduced-motion:reduce){.barra i{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <svg class="logo" viewBox="0 0 1080 249.9" role="img" aria-label="Leadfit"><rect x="884.13" y="68.55" width="38.49" height="112.8"/> <polygon points="863.63 98.49 863.63 68.55 761.26 68.55 728.29 68.55 728.29 181.35 766.78 181.35 766.78 140.07 851.19 140.07 851.19 115.65 766.78 115.65 766.78 98.49 863.63 98.49"/> <polygon points="1078.47 68.55 1021.75 68.55 988.78 68.55 943.12 68.55 943.12 98.49 991.55 98.49 991.55 181.35 1030.04 181.35 1030.04 98.49 1078.47 98.49 1078.47 68.55"/> <path d="M571.23,178.99l-16.68-102.84c-.49-3.02-3.1-5.24-6.16-5.24h-19.66c-3.24,0-6.32,1.38-8.47,3.8l-92.86,104.28h16.14c4.86,0,9.49-2.08,12.72-5.72l79.36-89.33,14.26,87.9c.67,4.12,4.23,7.15,8.4,7.15h12.96Z"/> <path d="M470.39,88.66l6.46-17.75h-81.65c-4.77,0-9.03,2.98-10.66,7.47l-33.01,90.68c-1.75,4.81,1.81,9.9,6.93,9.9l79.05.04,6.46-17.75h-65.05c-2.36,0-4.01-2.35-3.2-4.57l8.34-22.91h58.36l6.46-17.75h-58.36l8.6-23.64c.82-2.24,2.95-3.73,5.33-3.73h65.94Z"/> <path d="M279.9,156.69l31.22-85.77h-19.68l-35.74,98.19c-1.75,4.81,1.81,9.9,6.93,9.9h67.06l6.46-17.75h-53.05c-2.36,0-4.01-2.35-3.2-4.57Z"/> <path d="M668.48,70.92h-51.45c-4.77,0-9.03,2.98-10.66,7.47l-36.59,100.52-.04.11,59.47-.06c29.82-.03,62.78-24.2,73.63-54.02h0c10.86-29.83-4.52-54.02-34.36-54.02ZM620.94,92.4c.82-2.24,2.95-3.73,5.33-3.73h33.79c20.05,0,30.38,16.25,23.09,36.3h0c-7.3,20.05-29.46,36.3-49.51,36.3h-33.47c-2.08,0-3.53-2.07-2.82-4.03l23.6-64.84Z"/> <path d="M111.08,68.54l-3.2,9.28h0l-10.19,29.55h60.37l-42.45,36.73c-4.84,4.47-11.19,6.96-17.78,6.96h-29.69c-3.62,0-6.15-3.58-4.94-6.99l26.76-75.53h-52.57L2.12,167.93c-2.32,6.55,2.54,13.43,9.49,13.43h80.19c12.01,0,23.48-4.94,31.73-13.67l43.28-47.95-22.19,61.62h42.9l40.52-112.82h-116.95Z"/></svg>
    <span class="passo" id="passo"></span>
  </div>
  <div class="barra"><i id="progresso"></i></div>
</header>
<main id="tela" aria-live="polite"><p class="apoio">Carregando…</p></main>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzBVrmY2Ib7jvcykhZ3dbjDnGffpNeSEfSk3nR8TVYfJFRC-oYaXjXj_FCr-qMfCcD-/exec';
const NOME = 'Lead 360';
const CHAVE = 'lead-360';
const SETORES = ['Gestão','Salão de musculação','Aulas coletivas','Lead Vitta','Comercial','Recepção e Lead Coffee','Apoio'];
const CRITERIOS = [
  ['educacao','Educação e cortesia','Trata bem alunos e colegas'],
  ['apresentacao','Apresentação pessoal','Roupa, uniforme, postura'],
  ['tecnica','Técnica','Faz bem o que é da sua função'],
  ['equipe','Trabalho em equipe','Ajuda, se comunica, soma com o time'],
  ['wellness','Vive wellness e alta performance','Cuida do corpo e da rotina. Vive o que a gente ensina'],
];
const PASSOS = ['abertura','trabalho','lugar','gestao','voce','colegas','ideias'];
const MIN_COLEGAS = 3, MAX_COLEGAS = 5;

let todos = [], eu = null, equipe = [], passo = 0, a = { colegas: [] };
const tela = document.getElementById('tela');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify({ a, passo })); } catch (e) {} }
function carregar() {
  try { const d = JSON.parse(localStorage.getItem(CHAVE)); if (d) { a = d.a; passo = d.passo; } } catch (e) {}
}
function definirPessoa() {
  eu = todos.find(p => p.id === a.quem) || null;
  equipe = todos.filter(p => p.id !== a.quem);
  a.colegas = (a.colegas || []).filter(id => equipe.some(p => p.id === id));
}
function limpar() { try { localStorage.removeItem(CHAVE); } catch (e) {} }

function escala(id, titulo, max, opt = {}) {
  const valores = Array.from({ length: max + 1 }, (_, i) => i);
  if (opt.naoSei) valores.push('?');
  const cols = opt.naoSei ? 'e7' : 'e6';
  const marcado = v => (a[id] === null && v === '?') || a[id] === v;
  return `<fieldset class="q" data-q="${id}">
    <legend>${esc(titulo)}${opt.apoio ? `<small>${esc(opt.apoio)}</small>` : ''}</legend>
    <div class="escala ${cols}">${valores.map(v => `<label><input type="radio" name="${id}" value="${v}" ${marcado(v) ? 'checked' : ''}><span>${v}</span></label>`).join('')}</div>
    ${opt.pontas ? `<div class="pontas"><span>${esc(opt.pontas[0])}</span><span>${esc(opt.pontas[1])}</span></div>` : ''}
  </fieldset>`;
}
function aberta(id, titulo, apoio) {
  return `<div class="q" data-q="${id}"><label for="${id}">${esc(titulo)}${apoio ? `<small>${esc(apoio)}</small>` : ''}</label>
    <textarea id="${id}" data-t="${id}" maxlength="3000">${esc(a[id] || '')}</textarea></div>`;
}
function criterios(prefixo) {
  return CRITERIOS.map(([k, nome, apoio]) => escala(prefixo + k, nome, 5, { naoSei: true, apoio })).join('');
}
const NOTA_05 = ['0 = muito ruim', '5 = excelente'];

const TELAS = {
  abertura: () => `
    <span class="etiqueta">${esc(NOME)}</span>
    <h1>Quero ouvir você.</h1>
    <p>Antes da gente começar os treinamentos e as reuniões de alinhamento, eu quero saber de você como as coisas estão de verdade: o trabalho, o time, a gestão, o que precisa melhorar.</p>
    <div class="promessa">
      <div><b>Só eu leio.</b>Nenhuma pessoa do time, da coordenação ou do RH tem acesso às respostas.</div>
      <div><b>Seu nome fica comigo.</b>Ninguém vai saber a nota que você deu, nem quem deu nota para quem.</div>
      <div><b>Leva uns 10 minutos.</b>Pode parar no meio e voltar depois pelo mesmo link. O que você já marcou fica salvo neste celular.</div>
    </div>
    <p>Pode falar com sinceridade, tá? É isso que vai me ajudar.</p>
    <p><b>Carol Frazão</b></p>
    <div class="q" data-q="quem"><label for="quem">Para começar, quem é você?</label>
      <select id="quem"><option value="">Escolha seu nome</option>
      ${SETORES.map(s => { const ps = todos.filter(p => p.setor === s); return ps.length ? `<optgroup label="${esc(s)}">${ps.map(p => `<option value="${p.id}" ${a.quem === p.id ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</optgroup>` : ''; }).join('')}
      </select></div>`,
  trabalho: () => `
    <h1>Seu trabalho</h1>
    <p class="apoio">0 é nada, 5 é demais.</p>
    ${escala('gosta', 'O quanto você gosta de trabalhar aqui?', 5, { pontas: ['0 = nada', '5 = demais'] })}
    ${escala('entrosamento', 'O quanto você se dá bem com o time?', 5, { pontas: ['0 = nada', '5 = demais'] })}
    ${escala('indicaria', 'O quanto você indicaria a Lead para um amigo trabalhar aqui?', 5, { pontas: ['0 = jamais', '5 = com certeza'] })}
    ${aberta('maisGosta', 'O que você mais gosta daqui?')}
    ${aberta('maisAtrapalha', 'O que mais atrapalha o seu trabalho hoje?')}`,
  lugar: () => `
    <h1>O lugar</h1>
    <p class="apoio">Pense no lugar onde você trabalha. ${NOTA_05.join(', ')}.</p>
    ${escala('lugarEstrutura', 'Estrutura e equipamentos', 5)}
    ${escala('lugarMateriais', 'Tenho o material que preciso para trabalhar', 5)}
    ${escala('lugarLimpeza', 'Limpeza e organização', 5)}
    ${escala('lugarHorarios', 'Meus horários e minha escala', 5)}
    ${escala('lugarComunicacao', 'A comunicação entre os setores', 5)}`,
  gestao: () => `
    <h1>A gestão</h1>
    <p class="apoio">${NOTA_05.join(', ')}. Pode falar com sinceridade.</p>
    <div class="bloco"><h2>${esc(eu.lider)}, sua liderança direta</h2>
      ${escala('liderClareza', 'Deixa claro o que espera de mim', 5)}
      ${escala('liderEscuta', 'Me escuta quando eu preciso', 5)}
      ${escala('liderRespeito', 'Me trata com respeito', 5)}
      ${escala('liderRetorno', 'Me dá retorno sobre o meu trabalho', 5)}
    </div>
    <div class="bloco"><h2>A gestão do Grupo Lead</h2>
      ${escala('gestaoDecisoes', 'As decisões são explicadas com clareza', 5)}
      ${escala('gestaoPresenca', 'Sinto a gestão presente no dia a dia', 5)}
    </div>
    ${aberta('gestaoMelhorar', 'O que a gestão pode fazer melhor?', 'Inclusive eu.')}`,
  voce: () => `
    <h1>Você e seu time</h1>
    <p class="apoio">${NOTA_05.join(', ')}. Use ? quando não souber avaliar.</p>
    <div class="bloco"><h2>Você</h2>${criterios('auto_')}</div>
    <div class="bloco"><h2>Seu time (${esc(eu.setor)})</h2>${criterios('time_')}</div>`,
  colegas: () => {
    const ordem = [eu.setor, ...SETORES.filter(s => s !== eu.setor)];
    const grupos = ordem.map(s => {
      const pessoas = equipe.filter(p => p.setor === s);
      if (!pessoas.length) return '';
      return `<div class="grupo"><h3>${esc(s)}</h3><div class="fichas">${pessoas.map(p =>
        `<button type="button" class="ficha" data-p="${p.id}" aria-pressed="${a.colegas.includes(p.id)}">${esc(p.nome)}</button>`).join('')}</div></div>`;
    }).join('');
    const cards = a.colegas.map(id => {
      const p = equipe.find(x => x.id === id);
      if (!p) return '';
      const cid = 'c' + id + '_comentario';
      return `<div class="bloco"><h2>${esc(p.nome)}</h2>${criterios('c' + id + '_')}
        <div class="q"><label for="${cid}">Quer dizer algo sobre ${esc(p.nome)}?<small>Opcional</small></label>
        <input type="text" id="${cid}" data-t="${cid}" maxlength="500" value="${esc(a[cid] || '')}"></div></div>`;
    }).join('');
    return `<h1>Seus colegas</h1>
      <p>Escolha de ${MIN_COLEGAS} a ${MAX_COLEGAS} pessoas com quem você mais convive no trabalho. Ninguém vai ver sua nota.</p>
      ${grupos}
      <p class="contagem">${a.colegas.length} de ${MAX_COLEGAS} escolhidas</p>
      ${a.colegas.length ? `<p class="apoio">${NOTA_05.join(', ')}. Use ? quando não souber avaliar.</p>` : ''}
      ${cards}`;
  },
  ideias: () => `
    <h1>Suas ideias</h1>
    <p class="apoio">Escreva do seu jeito. Se não tiver nada para dizer em alguma, escreva "nada".</p>
    ${aberta('melhoriaSetor', 'O que você melhoraria no seu setor?')}
    <div class="q" data-q="outroSetor"><label for="outroSetor">Escolha outro setor para dar uma sugestão</label>
      <select id="outroSetor" data-t="outroSetor"><option value="">Escolha o setor</option>
      ${SETORES.filter(s => s !== eu.setor).map(s => `<option ${a.outroSetor === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div>
    ${aberta('melhoriaOutro', 'O que esse setor poderia melhorar?')}
    ${aberta('critica', 'Tem alguma crítica ou opinião que você quer que eu saiba?')}
    ${aberta('aprender', 'O que você gostaria de aprender nos próximos treinamentos?')}`,
};

function obrigatorias(nome) {
  const ids = [];
  const raiz = { trabalho: ['gosta','entrosamento','indicaria','maisGosta','maisAtrapalha'],
    lugar: ['lugarEstrutura','lugarMateriais','lugarLimpeza','lugarHorarios','lugarComunicacao'],
    gestao: ['liderClareza','liderEscuta','liderRespeito','liderRetorno','gestaoDecisoes','gestaoPresenca','gestaoMelhorar'],
    ideias: ['melhoriaSetor','outroSetor','melhoriaOutro','critica','aprender'] }[nome];
  if (raiz) ids.push(...raiz);
  if (nome === 'voce') for (const p of ['auto_','time_']) CRITERIOS.forEach(([k]) => ids.push(p + k));
  if (nome === 'colegas') a.colegas.forEach(id => CRITERIOS.forEach(([k]) => ids.push('c' + id + '_' + k)));
  return ids;
}

function validar() {
  const nome = PASSOS[passo];
  if (nome === 'abertura' && !eu) return 'Escolha seu nome para começar.';
  const faltam = obrigatorias(nome).filter(id => a[id] === undefined || (typeof a[id] === 'string' && a[id].trim().length < 2));
  tela.querySelectorAll('.q.falta').forEach(q => q.classList.remove('falta'));
  faltam.forEach(id => { const q = tela.querySelector(`[data-q="${id}"]`); if (q) q.classList.add('falta'); });
  if (nome === 'colegas' && a.colegas.length < MIN_COLEGAS) {
    return `Escolha pelo menos ${MIN_COLEGAS} pessoas para continuar.`;
  }
  if (faltam.length) {
    const q = tela.querySelector('.q.falta');
    if (q) q.scrollIntoView({ block: 'center' });
    return faltam.length === 1 ? 'Falta 1 resposta nesta tela.' : `Faltam ${faltam.length} respostas nesta tela.`;
  }
  return '';
}

function desenhar(rolar = true) {
  const nome = PASSOS[passo];
  const ultimo = passo === PASSOS.length - 1;
  tela.innerHTML = TELAS[nome]() + `
    <p class="aviso" id="aviso" hidden></p>
    <div class="acoes">
      ${passo ? '<button type="button" class="btn" id="voltar">Voltar</button>' : ''}
      <button type="button" class="btn principal" id="seguir">${passo === 0 ? 'Começar' : ultimo ? 'Enviar para a Carol' : 'Continuar'}</button>
    </div>`;
  document.getElementById('passo').textContent = passo ? `${passo} de ${PASSOS.length - 1}` : '';
  document.getElementById('progresso').style.width = (passo / (PASSOS.length - 1) * 100) + '%';
  if (rolar) window.scrollTo(0, 0);
}

function mostrarAviso(msg) {
  const el = document.getElementById('aviso');
  el.textContent = msg;
  el.hidden = !msg;
}

async function enviar() {
  const botao = document.getElementById('seguir');
  botao.disabled = true;
  botao.textContent = 'Enviando…';
  mostrarAviso('');
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ id: a.quem, a }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro);
    limpar();
    final('Recebi suas respostas.', 'Obrigada por confiar em mim e falar com sinceridade. Vou ler tudo com muito carinho.');
  } catch (e) {
    botao.disabled = false;
    botao.textContent = 'Enviar para a Carol';
    mostrarAviso('Não consegui enviar. Suas respostas continuam aqui. Confira a internet e toque em Enviar de novo.');
  }
}

function final(titulo, texto) {
  document.getElementById('passo').textContent = '';
  document.getElementById('progresso').style.width = '100%';
  tela.innerHTML = `<h1>${esc(titulo)}</h1><p>${esc(texto)}</p>`;
  window.scrollTo(0, 0);
}

tela.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'quem') { a.quem = Number(t.value) || null; definirPessoa(); salvar(); mostrarAviso(''); }
  if (t.type === 'radio') {
    a[t.name] = t.value === '?' ? null : Number(t.value);
    const q = t.closest('.q');
    if (q) q.classList.remove('falta');
    salvar();
  }
});
tela.addEventListener('input', e => {
  const id = e.target.dataset.t;
  if (id) {
    a[id] = e.target.value;
    const q = e.target.closest('.q');
    if (q) q.classList.remove('falta');
    salvar();
  }
});
tela.addEventListener('click', e => {
  const ficha = e.target.closest('.ficha');
  if (ficha) {
    const id = Number(ficha.dataset.p);
    const i = a.colegas.indexOf(id);
    if (i >= 0) a.colegas.splice(i, 1);
    else if (a.colegas.length < MAX_COLEGAS) a.colegas.push(id);
    else return mostrarAviso(`Você já escolheu ${MAX_COLEGAS}. Toque em um nome para tirar.`);
    const topo = window.scrollY;
    salvar();
    desenhar(false);
    window.scrollTo(0, topo);
    return;
  }
  if (e.target.id === 'voltar') { passo--; salvar(); desenhar(); }
  if (e.target.id === 'seguir') {
    const erro = validar();
    mostrarAviso(erro);
    if (erro) return;
    if (passo === PASSOS.length - 1) return enviar();
    passo++; salvar(); desenhar();
  }
});

async function iniciar() {
  try {
    const d = await (await fetch(API)).json();
    if (!d.ok) throw new Error(d.erro);
    todos = d.equipe;
    carregar();
    definirPessoa();
    if (!eu) passo = 0;
    desenhar();
  } catch (e) {
    tela.innerHTML = '<h1>Sem conexão</h1><p>Não consegui abrir o formulário. Confira a internet.</p><div class="acoes"><button type="button" class="btn principal" onclick="location.reload()">Tentar de novo</button></div>';
  }
}
iniciar();
</script>
